name: 直播源有效性检查

on:
  schedule:
    # UTC 时间，每 4 小时一次（北京时间 02/06/10/14/18/22 点）
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      src_txt:
        description: "源 txt 地址（留空用默认 luobuqingcai 那份）"
        required: false
        default: ""
      src_m3u:
        description: "源 m3u 地址（留空自动按 txt 同名推导，先试 .m3u 再试 .m3u8）"
        required: false
        default: ""
      min_ratio:
        description: "最低有效率保护 0~1（低于此值视为源站异常，不覆盖文件）"
        required: false
        default: "0.05"
      deep:
        description: "深检子播放列表与首个分片（1=开 0=关）"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: juhe-stream-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 检查并重新生成
        env:
          # 手动 Run 时填了就用填的，没填用默认；m3u 留空则按 txt 同名自动推导
          SRC_TXT: ${{ github.event.inputs.src_txt || 'http://luobuqingcai.hostingem.ru/zb/juhe29.txt' }}
          SRC_M3U: ${{ github.event.inputs.src_m3u || '' }}
          OUT_TXT: juhe29.txt
          OUT_M3U: juhe29.m3u
          WORKERS: "32"
          DEEP_WORKERS: "24"
          TIMEOUT: "8"
          CONNECT_TIMEOUT: "4"
          RETRIES: "1"
          SEC_PER_URL_CAP: "20"
          KEEP_NON_HTTP: "1"
          MIN_ITEMS: "20"
          REPORT: check-report.json
          DEEP: ${{ github.event.inputs.deep || '1' }}
          MIN_RATIO: ${{ github.event.inputs.min_ratio || '0.05' }}
        run: python scripts/check_streams.py

      - name: 提交更新
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in juhe29.txt juhe29.m3u check-report.json; do
            [ -f "$f" ] && git add -- "$f"
          done
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 清理失效直播源 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filtered-playlist
          path: |
            juhe29.txt
            juhe29.m3u
            check-report.json
          if-no-files-found: warn
